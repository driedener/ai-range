---
# Runs on the Linux servers (become). Privilege escalation (T1548.003) and key reuse (T1021.004/T1552.004):
#  - Linux web server: account "deploy" (entry point for linux-path) with sudo NOPASSWD on find/vim (GTFOBins)
#  - root on the web server has an SSH key without passphrase that is valid for root on the DB server
#  - DB server: root's backup script with domain credentials (svc.backup) -> path back into AD
- name: Linux web server – deploy with sudo misconfiguration
  when: inventory_hostname == vuln_linux_web
  block:
    # Build the hash on the target (fixed salt = idempotent); password_hash would need passlib in the tools container
    - name: Password hash for deploy
      ansible.builtin.command: openssl passwd -6 -salt airangedeploy -stdin
      args:
        stdin: "{{ vuln_linux_password }}"
      register: vuln_linux_hash
      changed_when: false
      no_log: true

    - name: Account deploy
      ansible.builtin.user:
        name: "{{ vuln_linux_user }}"
        password: "{{ vuln_linux_hash.stdout }}"
        shell: /bin/bash
        state: present

    - name: sudo rule
      ansible.builtin.copy:
        dest: /etc/sudoers.d/50-deploy
        mode: "0440"
        content: |
          # Deployment scripts need find/vim as root (TODO: restrict)
          {{ vuln_linux_user }} ALL=(root) NOPASSWD: /usr/bin/find, /usr/bin/vim
        validate: visudo -cf %s

    - name: SSH password login allowed for deploy
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-airange-deploy.conf
        mode: "0644"
        content: |
          Match User {{ vuln_linux_user }}
            PasswordAuthentication yes
      register: vuln_linux_sshd

    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
      when: vuln_linux_sshd is changed

    - name: root SSH key (without passphrase)
      ansible.builtin.command: ssh-keygen -q -t ed25519 -N "" -C root@{{ inventory_hostname }} -f /root/.ssh/id_ed25519
      args:
        creates: /root/.ssh/id_ed25519

    - name: Read public key
      ansible.builtin.slurp:
        src: /root/.ssh/id_ed25519.pub
      register: vuln_linux_pub

    - name: Hint to the DB server in the shell history
      ansible.builtin.lineinfile:
        path: /root/.bash_history
        line: "ssh root@{{ vuln_linux_db }} 'systemctl status postgresql'"
        create: true
        mode: "0600"

- name: Linux DB server – key reuse, credentials in a script
  when: inventory_hostname == vuln_linux_db
  block:
    - name: root/.ssh
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        mode: "0700"

    - name: Web server key allowed for root
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        line: "{{ hostvars[vuln_linux_web].vuln_linux_pub.content | b64decode | trim }}"
        create: true
        mode: "0600"

    - name: root login via key allowed
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-airange-root.conf
        mode: "0644"
        content: |
          PermitRootLogin prohibit-password
      register: vuln_linux_sshd_db

    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
      when: vuln_linux_sshd_db is changed

    - name: Backup script with domain credentials
      ansible.builtin.copy:
        dest: /root/backup_to_fs.sh
        mode: "0700"
        content: |
          #!/bin/bash
          # Nightly DB backup to the file server (cron disabled since the move)
          pg_dumpall > /var/backups/db.sql 2>/dev/null
          smbclient //{{ groups['fileserver'][0] | lower }}.{{ range_domain }}/Data -U '{{ range_netbios }}\svc.backup%{{ vuln_svc_passwords['svc.backup'] }}' \
            -c 'cd IT; put /var/backups/db.sql db_backup.sql'
