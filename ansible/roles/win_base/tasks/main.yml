---
- name: Set time zone
  ansible.windows.win_timezone:
    timezone: "{{ win_base_timezone }}"

# --- PowerShell-Logging ------------------------------------------------------
- name: Create transcript directory
  ansible.windows.win_file:
    path: "{{ win_base_transcript_dir }}"
    state: directory

- name: Enable PowerShell Script Block / Module Logging / Transcription
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: "{{ item.type }}"
  loop:
    - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging', name: EnableScriptBlockLogging, data: 1, type: dword }
    - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging', name: EnableModuleLogging, data: 1, type: dword }
    - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging\ModuleNames', name: '*', data: '*', type: string }
    - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription', name: EnableTranscripting, data: 1, type: dword }
    - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription', name: EnableInvocationHeader, data: 1, type: dword }
    - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription', name: OutputDirectory, data: "{{ win_base_transcript_dir }}", type: string }
  loop_control:
    label: "{{ item.name }}"

# --- Audit Policy -------------------------------------------------------------
- name: Enforce Advanced Audit Policy (subcategories instead of legacy categories)
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: SCENoApplyLegacyAuditPolicy
    data: 1
    type: dword

- name: Include command line in process events (4688)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit
    name: ProcessCreationIncludeCmdLine_Enabled
    data: 1
    type: dword

- name: Set audit subcategories
  ansible.windows.win_audit_policy_system:
    subcategory: "{{ item.subcategory }}"
    audit_type: "{{ item.audit_type }}"
  loop: "{{ win_base_audit_policy + win_base_audit_policy_extra }}"
  loop_control:
    label: "{{ item.subcategory }}"

- name: Enlarge Security event log
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Security
    name: MaxSize
    data: "{{ win_base_security_log_max_size }}"
    type: dword

# --- RDP ----------------------------------------------------------------------
- name: Allow RDP
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword

- name: Enable RDP firewall rules (language-independent group)
  ansible.windows.win_powershell:
    script: |
      $rules = Get-NetFirewallRule -Group '@FirewallAPI.dll,-28752' -ErrorAction SilentlyContinue |
        Where-Object { $_.Enabled -ne 'True' }
      if ($rules) {
        $rules | Enable-NetFirewallRule
        $Ansible.Changed = $true
      } else {
        $Ansible.Changed = $false
      }
