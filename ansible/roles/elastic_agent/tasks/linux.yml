---
- name: Gather services
  ansible.builtin.service_facts:

- name: Install Elastic Agent
  when: "'elastic-agent.service' not in ansible_facts.services"
  become: true
  vars:
    elastic_agent_pkg: "elastic-agent-{{ elastic_agent_version }}-linux-x86_64"
  block:
    - name: Create download directory
      ansible.builtin.file:
        path: "{{ elastic_agent_linux_tmp }}"
        state: directory
        mode: "0755"

    - name: Download and unpack Elastic Agent
      ansible.builtin.unarchive:
        src: "{{ elastic_agent_artifacts_url }}/{{ elastic_agent_pkg }}.tar.gz"
        dest: "{{ elastic_agent_linux_tmp }}"
        remote_src: true
        creates: "{{ elastic_agent_linux_tmp }}/{{ elastic_agent_pkg }}/elastic-agent"

    - name: Install Elastic Agent and enroll in Fleet
      ansible.builtin.command: >-
        ./elastic-agent install --non-interactive
        --url={{ elastic_agent_fleet_url }}
        --enrollment-token={{ elastic_agent_enrollment_token }}
        {{ elastic_agent_install_extra_args }}
      args:
        chdir: "{{ elastic_agent_linux_tmp }}/{{ elastic_agent_pkg }}"
      changed_when: true
      no_log: true

    - name: Remove installation files
      ansible.builtin.file:
        path: "{{ elastic_agent_linux_tmp }}"
        state: absent

- name: Elastic Agent service is running
  ansible.builtin.systemd_service:
    name: elastic-agent
    state: started
    enabled: true
  become: true
