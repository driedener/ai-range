---
# Runs on the DC (AD configuration partition). AD CS abuse (T1649):
#  - ESC1: template with "Supply in the request" (enrollee supplies subject), Client Auth, Domain Users may
#    enroll -> certificate for any UPN (e.g. Domain Admin)
#  - ESC4: harmless template on which Domain Users have write rights -> can be turned into ESC1
# Publishing on the CA and Web Enrollment (ESC8): tasks/publish.yml (runs on the CA host).
# The new template is a version 2 copy of the built-in template "User".
- name: Create templates
  ansible.windows.win_powershell:
    error_action: stop
    parameters:
      Templates: "{{ vuln_adcs_templates | to_json }}"
    script: |
      param([string]$Templates)
      Import-Module ActiveDirectory
      $Ansible.Changed = $false
      $cfg = (Get-ADRootDSE).configurationNamingContext
      $pks = "CN=Public Key Services,CN=Services,$cfg"
      $base = "CN=Certificate Templates,$pks"
      $src = Get-ADObject "CN=User,$base" -Properties *
      $oidBase = (Get-ADObject "CN=OID,$pks" -Properties 'msPKI-Cert-Template-OID').'msPKI-Cert-Template-OID'
      $enroll = [guid]'0e10c968-78fb-11d2-90d4-00c04f79dc55'   # Certificate-Enrollment
      function Sid($r) { try { $r.Translate([Security.Principal.SecurityIdentifier]) } catch { $null } }

      foreach ($t in ($Templates | ConvertFrom-Json)) {
        $dn = "CN=$($t.name),$base"
        if (-not (Get-ADObject -LDAPFilter "(cn=$($t.name))" -SearchBase $base)) {
          $oid = '{0}.{1}.{2}' -f $oidBase, (Get-Random -Minimum 1000000 -Maximum 99999999), (Get-Random -Minimum 1000000 -Maximum 99999999)
          $oidCn = '{0}.{1}' -f (Get-Random -Minimum 1000000 -Maximum 99999999), ([guid]::NewGuid().ToString('N').ToUpper())
          New-ADObject -Name $oidCn -Type 'msPKI-Enterprise-Oid' -Path "CN=OID,$pks" -OtherAttributes @{
            flags = 1; displayName = $t.display; 'msPKI-Cert-Template-OID' = $oid }
          # 1 = CT_FLAG_ENROLLEE_SUPPLIES_SUBJECT; otherwise UPN from AD + directory path (0x82000000)
          $nameFlag = if ($t.enrollee_supplies_subject) { 1 } else { -2113929216 }
          New-ADObject -Name $t.name -Type pKICertificateTemplate -Path $base -OtherAttributes @{
            displayName = $t.display
            flags = [int]$src.flags
            revision = 100
            pKIDefaultKeySpec = 1
            pKIKeyUsage = [byte[]]$src.pKIKeyUsage
            pKIMaxIssuingDepth = 0
            pKICriticalExtensions = @('2.5.29.15')
            pKIExpirationPeriod = [byte[]]$src.pKIExpirationPeriod
            pKIOverlapPeriod = [byte[]]$src.pKIOverlapPeriod
            pKIExtendedKeyUsage = @('1.3.6.1.5.5.7.3.2')
            pKIDefaultCSPs = @($src.pKIDefaultCSPs)
            'msPKI-RA-Signature' = 0
            'msPKI-Enrollment-Flag' = 0
            'msPKI-Private-Key-Flag' = 16
            'msPKI-Certificate-Name-Flag' = $nameFlag
            'msPKI-Minimal-Key-Size' = 2048
            'msPKI-Template-Schema-Version' = 2
            'msPKI-Template-Minor-Revision' = 0
            'msPKI-Cert-Template-OID' = $oid
            'msPKI-Certificate-Application-Policy' = @('1.3.6.1.5.5.7.3.2')
          }
          $Ansible.Changed = $true
        }

        # Rights: Domain Users may enroll (+ read); for ESC4 additionally write
        $sid = (Get-ADGroup 'Domain Users').SID
        $acl = Get-Acl "AD:$dn"
        $want = @(
          @{ rights = 'GenericRead'; type = [guid]::Empty },
          @{ rights = 'ExtendedRight'; type = $enroll })
        if ($t.users_can_write) { $want += @{ rights = 'GenericWrite'; type = [guid]::Empty } }
        $dirty = $false
        foreach ($w in $want) {
          # Bitmask instead of name: AD stores GenericWrite either split up (Self, WriteProperty) or combined
          $mask = [int][System.DirectoryServices.ActiveDirectoryRights]$w.rights
          $has = $acl.Access | Where-Object { $_.AccessControlType -eq 'Allow' -and
            ([int]$_.ActiveDirectoryRights -band $mask) -eq $mask -and $_.ObjectType -eq $w.type -and (Sid $_.IdentityReference) -eq $sid }
          if (-not $has) {
            $acl.AddAccessRule((New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
              $sid, [System.DirectoryServices.ActiveDirectoryRights]$w.rights, 'Allow', $w.type)))
            $dirty = $true
          }
        }
        if ($dirty) { Set-Acl -Path "AD:$dn" -AclObject $acl; $Ansible.Changed = $true }
      }
