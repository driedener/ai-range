# Read-only account for the SentinelOne Identity connector (AD configuration in the S1 console).
# Domain Users only, own password from S1_AD_PASSWORD – not the shared RANGE_USER_PASSWORD,
# which Red can spray. Empty password = account is not created.
ad_objects_s1_identity_user: svc.s1identity
ad_objects_s1_identity_password: "{{ lookup('env', 'S1_AD_PASSWORD') }}"
