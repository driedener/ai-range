---
# WinRM over HTTPS (5986) on the DC for the SentinelOne AD connector (useWinRmOverSsl).
# Needs the Domain Controller certificate from the Enterprise CA -> run only after the adcs role.
- name: Trigger autoenrollment (DC certificate)
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      certutil.exe -pulse | Out-Null
      gpupdate.exe /target:computer /force | Out-Null
  when: ad_objects_s1_identity_password | length > 0

# WinRM over HTTPS (5986) for the S1 AD connector (useWinRmOverSsl). Certificate: Domain Controller certificate from the
# Enterprise CA (CA01, autoenrollment) with Server Authentication and the FQDN of the DC.
- name: WinRM HTTPS listener with the DC certificate
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $fqdn = ([System.Net.Dns]::GetHostByName($env:COMPUTERNAME)).HostName
      $cert = Get-ChildItem Cert:\LocalMachine\My | Where-Object {
          $_.HasPrivateKey -and $_.NotAfter -gt (Get-Date).AddDays(7) -and
          ($_.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.1') -and
          ($_.DnsNameList.Unicode -contains $fqdn) } | Sort-Object NotAfter -Descending | Select-Object -First 1
      if (-not $cert) { throw "No Server Authentication certificate for $fqdn in LocalMachine\My" }
      $l = Get-ChildItem WSMan:\localhost\Listener | Where-Object { $_.Keys -contains 'Transport=HTTPS' }
      $current = if ($l) { (Get-ChildItem "WSMan:\localhost\Listener\$($l.Name)" | Where-Object Name -eq 'CertificateThumbprint').Value } else { $null }
      if ($current -ne $cert.Thumbprint) {
        if ($l) { Remove-Item -Path "WSMan:\localhost\Listener\$($l.Name)" -Recurse -Force }
        New-Item -Path WSMan:\localhost\Listener -Transport HTTPS -Address * -CertificateThumbPrint $cert.Thumbprint -HostName $fqdn -Force | Out-Null
        $Ansible.Changed = $true
      }
      if (-not (Get-NetFirewallRule -Name 'ai-range-WinRM-HTTPS' -ErrorAction SilentlyContinue)) {
        New-NetFirewallRule -Name 'ai-range-WinRM-HTTPS' -DisplayName 'Windows Remote Management (HTTPS-In, ai-range)' `
          -Direction Inbound -Protocol TCP -LocalPort 5986 -Action Allow -Profile Domain,Private | Out-Null
        $Ansible.Changed = $true
      }
      "Listener HTTPS: $fqdn / $($cert.Thumbprint) (valid until $($cert.NotAfter))"
  register: ad_objects_winrm_https
  # The DC certificate arrives via autoenrollment shortly after the CA is up
  until: ad_objects_winrm_https is succeeded
  retries: 20
  delay: 30
  when: ad_objects_s1_identity_password | length > 0
