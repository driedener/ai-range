---
# Shared values for the vulnerability profiles (playbooks/vulns.yml, roles/vuln_*).
#
# The passwords here are DELIBERATELY weak or well known: they are in rockyou (with the default rules
# of john/hashcat) or are typical spray candidates. They are part of the exercise and not secrets –
# real credentials (Domain Admin, RANGE_USER_PASSWORD …) still come only from docker/.env.
# They must satisfy the domain password policy (complexity, min. 7 characters).

vuln_all_profiles:
  - vuln_data
  - vuln_weak_passwords
  - vuln_asrep
  - vuln_kerberoast
  - vuln_acl
  - vuln_dcsync
  - vuln_delegation
  - vuln_adcs
  - vuln_gpp
  - vuln_smb
  - vuln_local_admin
  - vuln_llmnr
  - vuln_linux
  - vuln_webapp

# --- Accounts -----------------------------------------------------------------
