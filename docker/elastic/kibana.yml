server.host: "0.0.0.0"
server.name: kibana
server.publicBaseUrl: "https://${CONTROLLER_IP}:5601"
server.ssl.enabled: true
server.ssl.certificate: /usr/share/kibana/config/certs/kibana/kibana.crt
server.ssl.key: /usr/share/kibana/config/certs/kibana/kibana.key

elasticsearch.hosts: ["https://es01:9200"]
elasticsearch.username: kibana_system
elasticsearch.password: "${KIBANA_PASSWORD}"
elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca/ca.crt"]

xpack.encryptedSavedObjects.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"
xpack.security.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"
xpack.reporting.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"

# ---------------------------------------------------------------------------
# Fleet - preconfiguration
# VMs in VLAN 21 reach Fleet and ES via the controller IP. The own CA is
# distributed into the VMs' system trust store by Ansible.
# Elastic Defend is added later via API/Terraform (not preconfigurable).
# ---------------------------------------------------------------------------
xpack.fleet.fleetServerHosts:
  - id: default-fleet-server
    name: Controller Fleet Server
    is_default: true
    host_urls: ["https://${CONTROLLER_IP}:8220"]

xpack.fleet.outputs:
  - id: default-es
    name: Controller Elasticsearch
    type: elasticsearch
    is_default: true
    is_default_monitoring: true
    hosts: ["https://${CONTROLLER_IP}:9200"]

xpack.fleet.packages:
  - name: fleet_server
    version: latest
  - name: system
    version: latest
  - name: windows
    version: latest
  - name: auditd_manager
    version: latest
  - name: iis
    version: latest

xpack.fleet.agentPolicies:
  - name: Fleet Server Policy
    id: fleet-server-policy
    namespace: default
    monitoring_enabled: []
    package_policies:
      - name: fleet_server-1
        id: fleet_server-1
        package:
          name: fleet_server

  - name: range-windows
    id: range-windows
    namespace: range
    monitoring_enabled: [logs, metrics]
    package_policies:
      - name: system-windows
        id: system-windows
        package:
          name: system
      - name: windows-windows
        id: windows-windows
        package:
          name: windows
      # further integrations (IIS ...): Ansible elastic_fleet_config/integrations.yml -
      # Kibana does not apply new package_policies to existing policies.

  - name: range-linux
    id: range-linux
    namespace: range
    monitoring_enabled: [logs, metrics]
    package_policies:
      - name: system-linux
        id: system-linux
        package:
          name: system
      - name: auditd-linux
        id: auditd-linux
        package:
          name: auditd_manager
